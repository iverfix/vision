name: Check code quality
description: Run code formatting checks

runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      run: |
        find . \
          \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.c' -o -name '*.h' \) \
          -not -path "./build/*" \
          -print0 |
        xargs -0 clang-format-22 --dry-run --Werror

