name: Build cpp
description: Build Cpp project

inputs:
  compiler:
    required: true
  build_type:
    required: true

runs:
  using: composite
  steps:
    - name: Enable compiler problem matcher
      shell: bash
      run: |
        echo "::add-matcher::${{ github.workspace }}/.github/problem-matchers/cpp.json"

    - name: Configure
      shell: bash
      run: |
        cmake -S . \
          -B build/${{ inputs.build_type }} \
          -G Ninja \
          -DCMAKE_C_COMPILER=${{ inputs.compiler == 'gcc' && 'gcc' || 'clang' }} \
          -DCMAKE_CXX_COMPILER=${{ inputs.compiler == 'gcc' && 'g++' || 'clang++' }} \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=conan/${{ inputs.build_type }}/conan_toolchain.cmake

    - name: Build
      shell: bash
      run: |
        cmake --build build/${{ inputs.build_type }}

    - name: Remove problem matcher
      if: always()
      shell: bash
      run: |
        echo "::remove-matcher owner=cpp::"
